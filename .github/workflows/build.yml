# SPDX-License-Identifier: Apache-2.0
# Build the Internet-Draft from kramdown-rfc source and verify the tracked
# .xml / .txt artifacts are not stale: build to temp outputs and diff against
# the committed files so a no-op make cannot silently pass stale artifacts.
#
# Normalization: kramdown-rfc embeds a Ruby-version stamp in a generator comment
# (e.g. "generated by … (Ruby 4.0.5)") that varies by platform.  That line is
# stripped from both sides before diffing so the check is environment-agnostic.
# xml2rfc likewise writes its own version into a comment
# ("<!-- xml2rfc v2v3 conversion 3.34.1 -->"), and this job installs the newest
# xml2rfc, so a release alone would turn the check red.  That line is stripped
# too.  The rest of the .xml, and the whole .txt, are still compared.
#
# kramdown-rfc writes a <?line N?> processing instruction where each part of the
# Markdown source begins.  idnits3 warns about them (LINE_PI), and
# xml2rfc --remove-pis does not remove them, so the build deletes them from the
# .xml, as the Makefile does, and fails if one is left.
name: build

# A push to a PR branch is covered by its pull_request run, so push runs only on main.
on:
  push:
    branches: [main]
    paths: ["draft-*.md", "Makefile", ".refcache/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["draft-*.md", "Makefile", ".refcache/**", ".github/workflows/build.yml"]

permissions:
  contents: read

# A new push to a PR cancels that PR's earlier run. A main run gets a group of its own (its
# run id), since even with cancel-in-progress false GitHub cancels a pending run in a shared group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      # Pinned, so a tool release cannot change the rendered output and turn every open PR
      # red (runs 36455265138 and 43350281210). Bump these in a PR of their own.
      - name: install toolchain
        run: |
          gem install kramdown-rfc -v 1.7.43
          python -m pip install xml2rfc==3.35.0

      - name: build draft to temp + diff against tracked artifacts
        working-directory: .
        run: |
          DRAFT=$(grep '^DRAFT[[:space:]]*=' Makefile | sed 's/^DRAFT[[:space:]]*=[[:space:]]*//')
          echo "DRAFT=$DRAFT" >> "$GITHUB_ENV"
          mkdir -p _ci_build
          kramdown-rfc "$DRAFT.md" > _ci_build/.draft.v2.xml
          xml2rfc --v2v3 _ci_build/.draft.v2.xml -o _ci_build/"$DRAFT.xml"
          sed -i '/^[[:space:]]*<?line [0-9]*?>[[:space:]]*$/d' _ci_build/"$DRAFT.xml"
          if grep -n '<?line' _ci_build/"$DRAFT.xml"; then
            echo "a <?line?> PI is left in $DRAFT.xml"; exit 1
          fi
          xml2rfc --text --v3 _ci_build/"$DRAFT.xml" -o _ci_build/"$DRAFT.txt"
          rm -f _ci_build/.draft.v2.xml
          # Normalize out build-date-dependent content before diffing.
          # xml2rfc derives an expiry date (build date + 6 months) that appears in
          # both the XML <date> element and as "Expires …" text in the .txt output.
          # Strip those on both sides so the check is insensitive to build day.
          strip_xml() {
            grep -v -e 'generated by.*kramdown-rfc' \
                    -e '^ *<!-- xml2rfc v2v3 conversion [0-9][0-9.]* -->$' | \
            sed 's/<date year="[^"]*" month="[^"]*" day="[^"]*"\/>/<date\/>/g'
          }
          strip_txt() {
            # Normalize ONLY the four build-day-derived date locations in RFC .txt output.
            # Bibliographic reference dates (e.g. "24 June 2026" in [ccf-profile-04])
            # are content-derived — do NOT normalise them so a stale reference goes RED.
            #
            # The final rule collapses whitespace runs on lines a date rule already
            # touched.  xml2rfc right-pads these lines to a fixed column, so the date's
            # own WIDTH shifts the padding: "13 February 2027" is one character longer
            # than "6 February 2027", moving every page footer by one space.  Replacing
            # the date text alone leaves that shift behind, which made the gate pass or
            # fail according to the day of the month rather than according to staleness.
            # Only already-normalised lines are collapsed, so page numbers and every
            # content line stay compared byte-for-byte.
            sed \
              -e 's/^Expires: [0-9][0-9]* [A-Za-z][A-Za-z]* [0-9][0-9][0-9][0-9]/Expires: DATE_NORM/' \
              -e 's/expire on [0-9][0-9]* [A-Za-z][A-Za-z]* [0-9][0-9][0-9][0-9]/expire on DATE_NORM/' \
              -e 's/Expires [0-9][0-9]* [A-Za-z][A-Za-z]* [0-9][0-9][0-9][0-9]  *\[Page/Expires DATE_NORM [Page/' \
              -e '/^ *[0-9][0-9]* [A-Za-z][A-Za-z]* [0-9][0-9][0-9][0-9] *$/s/.*/DATE_NORM/' \
              -e '/DATE_NORM/s/  */ /g'
          }
          diff <(strip_xml < "$DRAFT.xml") <(strip_xml < _ci_build/"$DRAFT.xml") \
            || { echo "STALE: $DRAFT.xml is out of date — run 'make' locally and commit"; exit 1; }
          diff <(strip_txt < "$DRAFT.txt") <(strip_txt < _ci_build/"$DRAFT.txt") \
            || { echo "STALE: $DRAFT.txt is out of date — run 'make' locally and commit"; exit 1; }

      - name: assert RFCXML v3
        working-directory: .
        run: grep -q 'version="3"' _ci_build/"${DRAFT}.xml"

      - name: idnits
        working-directory: .
        run: npx --yes @ietf-tools/idnits _ci_build/"${DRAFT}.txt" || true
