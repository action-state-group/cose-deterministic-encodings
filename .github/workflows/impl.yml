# SPDX-License-Identifier: BSD-3-Clause
# Run the Python and Go reference code against the shared vectors, and check
# that vectors/vectors.json is what vectors/generate.py produces.
name: impl

# A push to a PR branch is covered by its pull_request run, so push runs only on main.
on:
  push:
    branches: [main]
    paths: ["lib/**", "vectors/**", "draft-*.md", ".github/workflows/impl.yml"]
  pull_request:
    paths: ["lib/**", "vectors/**", "draft-*.md", ".github/workflows/impl.yml"]

permissions:
  contents: read

# A new push to a PR cancels that PR's earlier run. A main run gets a group of its own (its
# run id), since even with cancel-in-progress false GitHub cancels a pending run in a shared group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: vectors are current
        run: python3 vectors/generate.py --check
      - name: tests
        run: python3 -m unittest discover -s lib/python -v

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.22" }
      - name: vet and test
        working-directory: lib/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -v ./...
